<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.png" type="image/png" sizes="64x64">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>花花 Jasmine｜GEO推薦・網頁設計推薦・行銷設計接案工作室</title>
<meta name="description" content="花花 Jasmine 是台灣個人設計行銷工作室：GEO 生成式引擎優化、SEO、網頁設計、品牌行銷設計、電商圖、影片剪輯、LINE 官方帳號建置與 AI 互動模板，MNS 品牌詞實測 Google 第 1 名。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2ea; --bg2:#efe6d8; --ink:#1d1a17; --muted:#6f665c;
  --gold:#b8894a; --coral:#ff6b4a; --leaf:#2f5d50; --pink:#f6c9c1;
  --card:#fffaf2; --line:rgba(29,26,23,.12);
  --serif:"Noto Serif TC",serif; --display:"Fraunces","Noto Serif TC",serif; --sans:"Noto Sans TC",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

/* nav */
nav{position:fixed;inset:16px 16px auto;z-index:50;display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px 10px 20px;border-radius:999px;background:rgba(247,242,234,.72);backdrop-filter:blur(14px);border:1px solid var(--line);max-width:1160px;margin:0 auto}
.logo{font-family:var(--display);font-weight:600;font-size:20px;display:flex;align-items:center;gap:8px}
.logo svg{width:26px;height:26px}
.nav-links{display:flex;gap:4px}
.nav-links a{padding:8px 14px;border-radius:999px;font-size:14px;color:var(--muted);transition:.25s}
.nav-links a:hover{background:var(--ink);color:var(--bg)}
.nav-cta{background:var(--ink);color:var(--bg)!important}
.nav-links a.on:not(.nav-cta){color:var(--ink);font-weight:700}
@media(max-width:1020px){.nav-links{gap:0}.nav-links a{padding:8px 10px;font-size:13px}}
@media(max-width:860px){nav{flex-wrap:wrap;border-radius:24px;row-gap:6px}.nav-links{width:100%;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}.nav-links::-webkit-scrollbar{display:none}.nav-links a{white-space:nowrap;flex:none}}
/* nav dropdown: AI互動模板 */
.nav-dd{position:relative;display:flex}
.nav-dd-btn{cursor:pointer;user-select:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.nav-dd-btn::after{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:translateY(-2px) rotate(45deg);transition:transform .25s}
.nav-dd.open .nav-dd-btn::after{transform:translateY(1px) rotate(-135deg)}
.nav-dd-menu{display:none;position:absolute;top:calc(100% + 8px);left:50%;transform:translateX(-50%);z-index:60;flex-direction:row;gap:2px;padding:6px;border-radius:18px;background:rgba(255,255,255,.96);border:1px solid var(--line);box-shadow:0 12px 32px rgba(0,0,0,.12)}
.nav-dd-menu::before{content:"";position:absolute;left:0;right:0;top:-10px;height:10px}
.nav-dd-menu a{white-space:nowrap;padding:9px 14px!important}
.nav-dd.open .nav-dd-menu{display:flex}
.nav-links .nav-dd a.nav-dd-btn:hover{color:#fff}
@media(hover:hover) and (min-width:861px){.nav-dd:hover .nav-dd-menu{display:flex}}
@media(max-width:860px){.nav-links{flex-wrap:wrap;justify-content:center;row-gap:2px;overflow:visible!important;-webkit-overflow-scrolling:auto}.nav-dd{position:static;flex:none}.nav-dd-menu{top:calc(100% + 6px);width:max-content;max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center}.nav-dd-menu a{padding:9px 8px!important;font-size:12.5px}}

/* hero */
.hero{min-height:100svh;display:grid;place-items:center;position:relative;overflow:hidden;padding:120px 0 80px}
.hero::before{content:"";position:absolute;width:780px;height:780px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,107,74,.22),rgba(246,201,193,.18) 45%,transparent 70%);top:-160px;right:-200px;animation:float 14s ease-in-out infinite}
.hero::after{content:"";position:absolute;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(47,93,80,.16),transparent 70%);bottom:-200px;left:-160px;animation:float 18s ease-in-out infinite reverse}
@keyframes float{50%{transform:translate(-40px,40px) scale(1.06)}}
.hero-inner{position:relative;z-index:2;text-align:center}
.badge{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:1px solid var(--line);border-radius:999px;font-size:13px;color:var(--muted);background:var(--card)}
.badge i{width:8px;height:8px;border-radius:50%;background:#3ccf7a;box-shadow:0 0 0 4px rgba(60,207,122,.2);animation:pulse 1.8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(60,207,122,0)}}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(64px,13vw,168px);line-height:.95;letter-spacing:-.03em;margin:28px 0 8px}
.hero h1 em{font-style:italic;color:var(--coral)}
.hero h1 .zh{display:block;font-family:var(--serif);font-weight:900;font-size:.42em;letter-spacing:.08em;margin-bottom:.15em}
.tagline{font-family:var(--serif);font-size:clamp(18px,2.6vw,26px);font-weight:500}
.tagline span{background:linear-gradient(transparent 62%,var(--pink) 62%);padding:0 4px}
.hero p.sub{color:var(--muted);margin:14px auto 36px;max-width:520px}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;padding:15px 26px;border-radius:999px;font-weight:500;transition:.3s cubic-bezier(.2,.8,.2,1);border:1px solid var(--ink)}
.btn-dark{background:var(--ink);color:var(--bg)}
.btn-dark:hover{background:var(--coral);border-color:var(--coral);transform:translateY(-3px) rotate(-1.5deg)}
.btn-ghost:hover{background:var(--card);transform:translateY(-3px) rotate(1.5deg)}
.btn .arr{transition:.3s}.btn:hover .arr{transform:translateX(4px)}
.petal{position:absolute;z-index:1;opacity:.9;animation:drift linear infinite}
@keyframes drift{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}
.hero-grid{position:relative;z-index:2;display:grid;grid-template-columns:1.05fr .95fr;gap:64px;align-items:center;width:100%}
.hero-copy{text-align:left}
.hero-copy h1{font-size:clamp(64px,10vw,150px)}
.hero-copy p.sub{margin:16px 0 34px}
.hero-copy .btns{justify-content:flex-start}
.cover{position:relative;aspect-ratio:4/5;width:100%;max-width:480px;margin-left:auto}
.cover-main{position:absolute;inset:4% 8% 8% 14%;border-radius:260px 260px 32px 32px;overflow:hidden;box-shadow:0 40px 80px -30px rgba(29,26,23,.45);animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
.cover-main img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.04)}
.c{position:absolute;margin:0;background:#fff;padding:7px;border-radius:16px;box-shadow:0 18px 40px -14px rgba(29,26,23,.35);animation:bob 5s ease-in-out infinite}
.c img{display:block;width:100%;border-radius:10px}
.c1{width:30%;top:6%;left:-4%;rotate:-9deg}
.c2{width:52%;bottom:-2%;left:-12%;rotate:5deg;animation-delay:-1.5s}
.c3{width:25%;top:20%;right:-6%;rotate:8deg;animation-delay:-3s}
.chip{position:absolute;background:var(--coral);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;box-shadow:0 10px 24px -8px rgba(255,107,74,.6);animation:bob 4s ease-in-out infinite}
.ch1{top:-1%;right:14%;rotate:6deg}
.ch2{bottom:20%;right:-4%;background:var(--leaf);rotate:-5deg;animation-delay:-2s;box-shadow:0 10px 24px -8px rgba(47,93,80,.6)}
.ring{position:absolute;width:26%;bottom:-4%;right:6%;animation:spin 22s linear infinite}
.ring-up{position:static;display:block;width:120px;height:120px;margin:22px 0 28px;filter:drop-shadow(0 12px 22px rgba(74,32,51,.28))}
@media(max-width:900px){.ring-up{margin:20px auto 26px}}
@keyframes rise{from{opacity:0;transform:translateY(40px)}}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr;gap:56px}.hero-copy{text-align:center}.hero-copy .btns{justify-content:center}.hero-copy p.sub{margin:16px auto 34px}.cover{margin:0 auto;max-width:400px;width:86%}}
.scroll-hint{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:.2em;color:var(--muted);z-index:2}

/* marquee */
.marquee{background:var(--ink);color:var(--bg);overflow:hidden;padding:18px 0;transform:rotate(-1.5deg);margin:0 -20px}
.track{display:flex;gap:48px;white-space:nowrap;animation:scroll 28s linear infinite;font-family:var(--display);font-size:28px;font-style:italic}
.track span{display:flex;align-items:center;gap:48px}
.track b{color:var(--coral);font-style:normal}
@keyframes scroll{to{transform:translateX(-50%)}}

/* sections */
section.block{padding:130px 0}
.eyebrow{font-size:13px;letter-spacing:.25em;color:var(--gold);text-transform:uppercase;font-weight:700}
h2{font-family:var(--serif);font-weight:900;font-size:clamp(34px,5vw,58px);line-height:1.15;margin:12px 0 20px;letter-spacing:.02em}
h2 em{font-family:var(--display);font-style:italic;font-weight:400;color:var(--coral)}

/* about */
.about{display:grid;grid-template-columns:1fr 1.15fr;gap:72px;align-items:center}
.portrait{aspect-ratio:4/5;border-radius:220px 220px 28px 28px;background:linear-gradient(160deg,var(--pink),#ffd9a8 55%,var(--coral));position:relative;overflow:hidden;display:grid;place-items:center}
.portrait svg{width:58%;opacity:.95;animation:spin 40s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sticker{position:absolute;background:var(--card);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.08);animation:bob 4s ease-in-out infinite}
.sticker.s1{top:10%;left:6%;transform:rotate(-6deg)}
.sticker.s2{bottom:12%;right:6%;transform:rotate(5deg);animation-delay:-2s}
@keyframes bob{50%{translate:0 -10px}}
.about p{color:var(--muted);margin-bottom:16px;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px;border-top:1px solid var(--line);padding-top:28px}
.stats strong{display:block;font-family:var(--display);font-size:44px;font-weight:400;line-height:1}
.stats small{color:var(--muted);font-size:13px}
.hero-copy .tagline{margin-bottom:34px}
.hero-portrait .hero-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%}
.hero-portrait .hero-mini{position:absolute;left:-14px;bottom:-14px;width:84px!important;opacity:1;z-index:2;filter:drop-shadow(0 8px 16px rgba(74,32,51,.3))}
.hero-portrait{overflow:visible!important}
.hero-portrait .hero-art{border-radius:inherit}
.hero-portrait .sticker{z-index:3}
.hero-portrait .sticker.s1{left:13%;top:9%}
@media(min-width:901px){.hero-grid{grid-template-columns:auto 380px;justify-content:center;gap:90px}.hero-portrait{width:380px;max-width:none}}
.hero-portrait{width:100%;max-width:440px;margin-left:0;box-shadow:0 40px 80px -30px rgba(74,32,51,.4)}
@media(max-width:900px){.hero-portrait{margin:0 auto;max-width:360px}}
@media(max-width:860px){.about{grid-template-columns:1fr;gap:48px}.portrait{max-width:380px;margin:0 auto;width:100%}}

/* works */
.works-head{display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap;margin-bottom:44px}
.filters{display:flex;gap:8px;flex-wrap:wrap}
.filters button{font:inherit;font-size:14px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;color:var(--ink);transition:.2s}
.filters button.on,.filters button:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:20px}
.work{grid-column:span 4;border-radius:24px;overflow:hidden;background:var(--card);border:1px solid var(--line);transition:.45s cubic-bezier(.2,.8,.2,1);cursor:pointer}
.work.wide{grid-column:span 8}
.work:hover{transform:translateY(-8px) rotate(-.6deg);box-shadow:0 30px 60px -20px rgba(29,26,23,.25)}
.work .thumb{aspect-ratio:4/3;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-size:42px;color:rgba(255,255,255,.95);position:relative;overflow:hidden}
.work.wide .thumb{aspect-ratio:auto;height:100%;min-height:300px;max-height:420px}
.work.wide{display:grid;grid-template-rows:1fr auto}
.work .thumb::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 50%)}
.work .meta{padding:18px 22px;display:flex;justify-content:space-between;align-items:center}
.work h3{font-size:17px;font-weight:700}
.work .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:3px 10px;border-radius:999px}
.work.hide{display:none}
.thumb.img{background:var(--bg2);padding:0}
.thumb.img img{width:100%;height:100%;object-fit:cover;display:block;transition:.6s cubic-bezier(.2,.8,.2,1)}
.work:hover .thumb.img img{transform:scale(1.04)}
.thumb.img::after{display:none}
.thumb.sq{aspect-ratio:1/1}
.thumb.tall{aspect-ratio:3/4}
.work{display:flex;flex-direction:column}
.work .thumb.img{flex:1}
.work.wide .thumb.img{aspect-ratio:3/2;height:auto;min-height:0;max-height:none}
.t1{background:linear-gradient(135deg,#2f5d50,#7fb39f)}
.t2{background:linear-gradient(135deg,#ff6b4a,#ffb36b)}
.t3{background:linear-gradient(135deg,#1d1a17,#5b4a3a)}
.t4{background:linear-gradient(135deg,#b8894a,#f1d29c)}
.t5{background:linear-gradient(135deg,#e88aa0,#f6c9c1)}
.t6{background:linear-gradient(135deg,#3b4cca,#9aa8ff)}
@media(max-width:860px){.work,.work.wide{grid-column:span 12}}

/* services */
.services{background:var(--ink);color:var(--bg);border-radius:48px;margin:0 12px}
.services h2{color:var(--bg)}
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:rgba(247,242,234,.15);border-radius:24px;overflow:hidden;margin-top:48px}
.svc div{background:var(--ink);padding:34px 28px;transition:.35s}
.svc div:hover{background:#2a2622}
.svc .ico{font-size:30px;display:inline-block;transition:.4s}
.svc div:hover .ico{transform:rotate(-12deg) scale(1.2)}
.svc h3{font-family:var(--serif);font-size:22px;margin:16px 0 8px}
.svc p{color:rgba(247,242,234,.6);font-size:15px}
.svc .n{font-family:var(--display);font-style:italic;color:var(--coral);font-size:14px}

/* contact */
.contact{text-align:center}
.contact h2{font-size:clamp(40px,7vw,88px)}
.links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.links a,.links button{font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:14px 22px;border-radius:18px;background:var(--card);border:1px solid var(--line);transition:.3s;text-align:left}
.links b{font-size:15px}.links span{font-size:13px;color:var(--muted)}
.links button:hover span,.links a:hover span{color:inherit}
.links a:hover,.links button:hover{transform:translateY(-4px) rotate(-2deg);background:var(--coral);color:#fff;border-color:var(--coral)}
.cgroups{display:grid;gap:36px;margin-top:44px;max-width:900px;margin-left:auto;margin-right:auto}
.cg h4{font-family:var(--serif);font-size:18px;margin-bottom:14px}
.cg h4 small{font-family:var(--sans);font-weight:400;font-size:13px;color:var(--muted);margin-left:10px}
.links a.qrcard{align-items:center;text-align:center;padding:14px 16px 12px;border-color:#06c75544}
.qrcard .qr{width:120px;height:120px;display:block;border-radius:8px;margin-bottom:6px}
.links a.qrcard b{color:#06a948}
.links a.qrcard:hover{background:#06c755;border-color:#06c755;color:#fff}
.links a.qrcard:hover b{color:#fff}
.toast{position:fixed;left:50%;bottom:32px;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 20px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* contact redesign */
.contact .wrap{text-align:center}
.cgroups{display:grid;gap:56px;margin:56px auto 0;max-width:1000px;text-align:left}
.blk-h{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:22px}
.blk-h .num{font-family:var(--display);font-style:italic;color:var(--coral);font-size:20px}
.blk-h h4{font-family:var(--serif);font-size:26px;font-weight:900;margin:0}
.blk-h small{color:var(--muted);font-size:14px}
.dm{display:grid;grid-template-columns:1.1fr 1fr;gap:18px}
.dm-line{display:flex;align-items:center;gap:26px;padding:26px;border-radius:28px;background:linear-gradient(135deg,#06c755,#04a446);color:#fff;transition:.35s;position:relative;overflow:hidden}
.dm-line::after{content:"LINE";position:absolute;right:-10px;bottom:-34px;font-family:var(--display);font-size:120px;font-weight:600;opacity:.12}
.dm-line:hover{transform:translateY(-4px) rotate(-.8deg);box-shadow:0 24px 50px -20px rgba(6,199,85,.7)}
.qrwrap{background:#fff;padding:10px;border-radius:18px;flex:none;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)}
.qrwrap .qr{width:132px;height:132px;display:block}
.dm-line b{display:block;font-family:var(--display);font-size:38px;line-height:1.1;margin:8px 0 6px}
.dm-line p{font-size:14px;opacity:.9;margin:0}
.pill{display:inline-block;font-size:12px;font-weight:700;background:rgba(255,255,255,.22);padding:4px 10px;border-radius:999px}
.dm-side{display:grid;gap:12px;align-content:start}
.dm-card{font:inherit;color:inherit;cursor:pointer;display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:left;transition:.3s}
.dm-card:hover{border-color:var(--c);transform:translateX(4px)}
.dm-card .t{flex:1;display:flex;flex-direction:column}
.dm-card b{font-size:16px}.dm-card .h{font-size:13px;color:var(--muted)}
.dm-card .copy{font-size:12px;font-weight:700;color:var(--c);border:1px solid var(--c);padding:5px 12px;border-radius:999px;transition:.2s}
.dm-card:hover .copy{background:var(--c);color:#fff}
.dm-note{font-size:13px;color:var(--muted);margin:4px 4px 0}
.ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:900;font-size:15px;flex:none;font-family:var(--sans)}
.soc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sc{font:inherit;color:inherit;cursor:pointer;position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;padding:16px;border-radius:20px;background:var(--card);border:1px solid var(--line);text-align:left;transition:.3s;overflow:hidden}
.sc .ic{grid-row:span 2}
.sc b{font-size:15px;align-self:end}.sc .h{font-size:12.5px;color:var(--muted);align-self:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc .go{position:absolute;top:10px;right:12px;font-style:normal;font-size:13px;color:var(--muted);transition:.3s}
.sc:hover{transform:translateY(-4px);border-color:var(--c);box-shadow:0 16px 30px -18px var(--c)}
.sc:hover .go{color:var(--c);transform:translate(2px,-2px)}
.sc.all{--c:var(--coral);background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sc.all .h{color:rgba(247,242,234,.6)}
.more{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.mc{position:relative;border-radius:28px;padding:30px;overflow:hidden;min-height:300px;display:flex;flex-direction:column}
.mc .kicker{font-size:11px;letter-spacing:.22em;font-weight:700;opacity:.7}
.mc h5{font-family:var(--serif);font-size:30px;font-weight:900;margin:8px 0 10px}
.mc p{font-size:15px;opacity:.85;margin:0 0 20px;max-width:330px}
.mc-links{display:flex;flex-wrap:wrap;gap:10px;position:relative;z-index:2}
.mc-links a{padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;transition:.25s}
