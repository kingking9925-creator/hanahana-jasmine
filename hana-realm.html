<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>花之境界 Online｜花花遊戲區</title>
<meta name="robots" content="noindex,follow">
<meta name="theme-color" content="#2b2140">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Noto+Serif+TC:wght@900&display=swap">
<link rel="stylesheet" href="hana-realm.css">
<script src="members.js" defer></script>
</head>
<body>
<div id="app" data-theme-keep>
  <!-- 會員檢查 -->
  <section id="gate" class="screen gate show">
    <div class="gate-card">
      <div class="logo-mark">🌸</div>
      <h1>花之境界 Online</h1>
      <p class="en">HANA REALM ONLINE</p>
      <p id="gateMsg">正在確認會員狀態…</p>
      <div id="gateBtns" class="row" hidden>
        <button class="btn pri" data-mz-open="login">登入</button>
        <button class="btn" data-mz-open="register">註冊會員</button>
      </div>
      <a class="link" href="play.html">← 回到花花遊戲區</a>
    </div>
  </section>

  <!-- 標題畫面 -->
  <section id="title" class="screen title" data-theme-keep>
    <div class="title-sky"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="title-panel">
      <i class="tp-c tl"></i><i class="tp-c tr"></i><i class="tp-c bl"></i><i class="tp-c br"></i>
      <span class="tp-gem">✿</span>
      <div class="title-logo">
      <div class="tl-wrap"><h1 class="tl-main">花之境界</h1></div>
      <p class="tl-sub">ONLINE</p>
      </div>
      <div class="title-actions">
      <button id="btnStart" class="tbtn pri">創建角色</button>
      <button id="btnNew" class="tbtn" hidden>重新創角</button>
      </div>
    </div>
  </section>

  <!-- 職業選擇 -->
  <section id="classpick" class="screen classpick" data-theme-keep>
    <div class="cp-wrap">
      <header class="cp-head"><p class="cp-step">STEP 1 / 2</p><h1>選擇你的職業</h1><p>職業決定你的戰鬥方式，選好之後就不能更改喔</p></header>
      <div id="cpList" class="cp-list"></div>
      <div id="cpDetail" class="cp-detail"></div>
      <div class="cp-actions"><button id="cpBack" class="tbtn">← 返回</button><button id="cpGo" class="tbtn pri">選擇這個職業 →</button></div>
    </div>
  </section>

  <!-- 捏臉創角 -->
  <section id="create" class="screen create">
    <div class="create-wrap"><div id="optArt" hidden></div><div id="optHair" hidden></div><div id="optHairColor" hidden></div><div id="optEye" hidden></div><div id="optOutfit" hidden></div><button id="btnRandom" hidden></button>
      <div class="create-preview">
        <canvas id="pv" width="320" height="360"></canvas>
      </div>
      <div class="create-form">
        <p class="cp-step dark" id="createStep">STEP 2 / 2</p><h2 id="createTitle">創造你的角色</h2>
        <label class="field">角色名稱<input id="inName" maxlength="8" placeholder="最多 8 個字"></label>
        <div class="field" id="clsChosen"><span class="fl">職業</span><div class="cls-chosen"><b id="clsChosenName"></b><button type="button" class="btn sm" id="btnRepick">重新選擇職業</button></div></div>
        <div class="field" id="clsRow" hidden>職業<div id="optCls" class="opts cls"></div></div>
        <div class="row end"><button id="btnCancelCreate" class="btn" hidden>取消</button><button id="btnCreate" class="btn pri">完成，進入王都 →</button></div>
      </div>
    </div>
  </section>

  <!-- 遊戲畫面 -->
  <section id="play" class="screen play">
    <canvas id="cv" width="960" height="540"></canvas>
    <!-- 小地圖 -->
    <div class="minimap" id="minimap">
      <div class="mm-h"><b id="hZone">櫻華王都</b><button type="button" id="mmToggle" title="收合小地圖">－</button></div>
      <canvas id="mm" width="232" height="104"></canvas>
    </div>
    <div class="hud-tr">
      <button class="ic" id="btnMenu" title="選單">☰</button>
    </div>
    <div id="toast" class="toast"></div>
    <div class="rotate-hint">📱 手機橫放玩起來更舒服喔</div>
    <div id="prompt" class="prompt"></div>

    <!-- 系統訊息 -->
    <div class="chatlog" id="chatlog"></div>

    <!-- 快捷欄：可放紅藥水、藍藥水、料理 -->
    <div class="quickslot" id="quickslot">
      <div class="qs-h"><span>快捷欄</span><button type="button" id="qsEdit" title="設定快捷欄">設定</button></div>
      <div class="qs-grid" id="qsGrid"></div>
    </div>

    <!-- 下方狀態列 -->
    <div class="statusbar">
      <div class="sb-lv"><small>LV.</small><b id="hLv">1</b></div>
      <div class="sb-me"><canvas id="face" width="56" height="56"></canvas><div><b id="hName">—</b><span id="hCls"></span></div></div>
      <div class="sb-bars">
        <div class="sbar hp"><em>HP</em><div class="bar"><i id="bHp"></i><span id="tHp"></span></div></div>
        <div class="sbar mp"><em>MP</em><div class="bar"><i id="bMp"></i><span id="tMp"></span></div></div>
        <div class="sbar exp"><em>EXP</em><div class="bar"><i id="bExp"></i><span id="tExp"></span></div></div>
      </div>
      <div class="sb-gold"><img class="gi" src="img/hr/ui/i_gold.webp" alt=""><b id="hGold">0</b></div>
      <div class="sb-menu">
        <button class="qb" id="qShop" title="商城 (B)"><img src="img/hr/ui/i_shop.webp" alt=""><small>商城</small></button>
        <button class="qb" id="qBag" title="背包 (I)"><img src="img/hr/ui/i_bag.webp" alt=""><small>背包</small></button>
        <button class="qb" id="qGear" title="裝備 (G)"><img src="img/hr/ui/i_gear.webp" alt=""><small>裝備</small></button>
        <button class="qb" id="qTal" title="天賦 (T)"><img src="img/hr/ui/i_talent.webp" alt=""><small>天賦</small><i class="dot" id="talDot" hidden></i></button>
        <button class="qb" id="qLife" title="生活技能 (L)"><img src="img/hr/ui/i_life.webp" alt=""><small>生活</small></button>
        <button class="qb" id="qAuto" title="自動打怪 (Q)"><img src="img/hr/ui/i_auto.webp" alt=""><small>自動</small></button>
      </div>
    </div>

    <div class="touch" id="touch">
      <div class="pad">
        <button data-k="left">◀</button><button data-k="right">▶</button>
      </div>
      <div class="acts">
        <button data-k="act" class="a-act"><img src="img/hr/ui/b_act.webp" alt="互動"></button>
        <button data-k="skill" class="a-skill"><img src="img/hr/ui/b_skill.webp" alt="技能"></button>
        <button data-k="attack" class="a-atk"><img src="img/hr/ui/b_atk.webp" alt="攻擊"></button>
        <button data-k="jump" class="a-jump"><img src="img/hr/ui/b_jump.webp" alt="跳"></button>
      </div>
    </div>

    <!-- 面板 -->
    <div id="panel" class="panel" hidden>
      <div class="panel-card" id="panelCard">
        <button class="x" id="panelX">×</button>
        <h3 id="panelT"></h3>
        <div id="panelB"></div>
      </div>
    </div>
  </section>
</div>
<script src="hana-realm.js"></script>
</body>
</html>
